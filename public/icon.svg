<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Primary Blue/Sky Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Success Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Slate Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Tech Circle decoration -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Animated-like Pulse Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.25" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" opacity="0.15" />

  <!-- Main Shield Shape -->
  <path d="M156 160 C 156 160, 256 120, 256 120 C 256 120, 356 160, 356 160 C 356 260, 310 340, 256 392 C 202 340, 156 260, 156 160 Z" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Dynamic Heartline / ECG Wave intertwined with clinical cross -->
  <g transform="translate(196, 176)">
    <!-- Shield Cross Support Base -->
    <path d="M60 20 L60 100 M20 60 L100 60" 
          stroke="url(#emeraldGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          opacity="0.3" />

    <!-- Sharp Professional Medical ECG Beat -->
    <path d="M0 60 L30 60 L42 25 L55 95 L68 45 L76 68 L85 60 L120 60" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
  </g>

  <!-- Dots decorative grid -->
  <circle cx="256" cy="75" r="5" fill="#38bdf8" />
  <circle cx="120" cy="380" r="4" fill="#34d399" />
  <circle cx="392" cy="380" r="4" fill="#38bdf8" />
</svg>
